function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickQuestions(){
  const picked = shuffle(questionPool).slice(0, 10);
  return picked.map(item => {
    const correctText = item.opts[item.a];
    const newOpts = shuffle(item.opts);
    return { q: item.q, opts: newOpts, a: newOpts.indexOf(correctText), fact: item.fact };
  });
}

let questions = pickQuestions();
let current = 0, score = 0, answered = false;
const quizArea = document.getElementById('quizArea');

function render(){
  if(current >= questions.length){ renderEnd(); return; }
  const q = questions[current];
  answered = false;
  quizArea.innerHTML = `
    <div class="progress-row"><span>Question ${current+1} of ${questions.length}</span><span class="score-tag">Score: ${score}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${(current/questions.length)*100}%"></div></div>
    <div class="question">${q.q}</div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="footer-row"><span></span><button class="next-btn" id="nextBtn">${current === questions.length-1 ? 'See results' : 'Next question'}</button></div>
  `;
  const optsDiv = document.getElementById('opts');
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    optsDiv.appendChild(btn);
  });
  document.getElementById('nextBtn').onclick = () => { current++; render(); };
}

function selectAnswer(i){
  if(answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn, idx) => {
    btn.disabled = true;
    if(idx === q.a) btn.classList.add('correct');
    else if(idx === i) btn.classList.add('wrong');
  });
  if(i === q.a) score++;
  const fb = document.getElementById('feedback');
  fb.textContent = q.fact;
  fb.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}

function renderEnd(){
  let best = 0;
  try{
    const stored = localStorage.getItem('filipinoTriviaHighScore');
    best = stored ? parseInt(stored, 10) : 0;
    if(score > best){ localStorage.setItem('filipinoTriviaHighScore', String(score)); best = score; }
  }catch(e){ /* storage unavailable, skip */ }

  let msg = "Not bad — try again to level up!";
  if(score === questions.length) msg = "Perfect score! Tunay na Pilipino sa puso!";
  else if(score >= questions.length * 0.7) msg = "Ang galing! You really know your stuff.";
  else if(score >= questions.length * 0.4) msg = "Good try! A little more reading and you'll ace it.";

  quizArea.innerHTML = `
    <div class="end">
      <h2>Quiz complete!</h2>
      <div class="big">${score} / ${questions.length}</div>
      <p>${msg}</p>
      <button class="again-btn" id="againBtn">Play again</button>
      <div class="high">Best score this browser: ${best} / ${questions.length}</div>
    </div>
  `;
  document.getElementById('againBtn').onclick = () => { questions = pickQuestions(); current = 0; score = 0; render(); };
}

render();
</script>
